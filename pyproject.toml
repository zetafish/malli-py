[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "malli"
dynamic = ["version"]
description = "A Python port of Clojure's malli — data-driven schemas and validation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Endymion Kasanardjo" }]
dependencies = []

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/malli/_version.py"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/malli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "basedpyright>=1.39.9",
    "hatch>=1.12",
]

[tool.ruff]
fix = true

[tool.basedpyright]
reportAny = false
reportExplicitAny = false
typeCheckingMode = "standard"
exclude = ["tests", ".venv", "build", "dist"]
