[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "malli"
version = "0.1.0"
description = "A Python port of Clojure's malli — data-driven schemas and validation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Endy Kasanardjo" }]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/malli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "basedpyright>=1.39.9",
]

[tool.ruff]
fix = true

[tool.basedpyright]
reportAny = false
reportExplicitAny = false
typeCheckingMode = "standard"
exclude = ["tests", ".venv", "build", "dist"]
