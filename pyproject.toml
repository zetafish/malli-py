[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "malli"
version = "0.1.0"
description = "A Python port of Clojure's malli — data-driven schemas and validation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Endy Kasanardjo" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/malli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
