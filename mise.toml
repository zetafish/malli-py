[tools]
python = "3.12"
uv = "latest"

[tasks.install]
description = "Install project + dev deps via uv"
run = "uv sync"

[tasks.test]
description = "Run tests"
run = "uv run pytest"

[tasks.repl]
description = "Start a Python REPL with the package importable"
run = "uv run python"

[tasks.typecheck]
description = "Run basedpyright"
run = "uv run basedpyright"

[tasks.clean]
description = "Remove build artifacts, caches, and venv"
run = """
rm -rf .venv build dist *.egg-info src/*.egg-info
find . -type d -name __pycache__ -exec rm -rf {} +
find . -type d -name .pytest_cache -exec rm -rf {} +
"""
