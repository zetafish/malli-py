[tools]
python = "3.12"
uv = "latest"

[tasks.install]
description = "Install project + dev deps via uv"
run = "uv sync"

[tasks.test]
description = "Run tests"
run = "uv run pytest"

[tasks.repl]
description = "Start a Python REPL with the package importable"
run = "uv run python"

[tasks.typecheck]
description = "Run basedpyright"
run = "uv run basedpyright"

[tasks.version]
description = "Print the version hatch-vcs will infer from git"
run = "uv run hatch version"

[tasks.build]
description = "Build sdist + wheel into dist/"
run = "uv run hatch build"

[tasks.release-check]
description = "Pre-release sanity: tests, typecheck, changelog has an unreleased-or-current entry"
run = """
uv run pytest -q
uv run basedpyright
grep -qE "^## [0-9]" CHANGELOG.md || { echo "CHANGELOG.md missing version section"; exit 1; }
"""

[tasks.release]
description = "Cut a release: commit staged changes, tag vX.Y.Z, push. Usage: mise run release X.Y.Z"
usage = '''
arg "<version>" help="Semver version like 0.2.0 (no v prefix)"
'''
run = """
set -e
TAG="v${usage_version}"
if git rev-parse "$TAG" >/dev/null 2>&1; then
  echo "tag $TAG already exists"; exit 1
fi
grep -qE "^## ${usage_version//./\\.}( |$)" CHANGELOG.md || {
  echo "CHANGELOG.md has no '## ${usage_version}' section"; exit 1
}
mise run release-check
git commit -am "Release ${usage_version}" || echo "nothing to commit"
git tag "$TAG"
git push && git push --tags
echo "released $TAG"
"""

[tasks.clean]
description = "Remove build artifacts, caches, and venv"
run = """
rm -rf .venv build dist *.egg-info src/*.egg-info
find . -type d -name __pycache__ -exec rm -rf {} +
find . -type d -name .pytest_cache -exec rm -rf {} +
"""
